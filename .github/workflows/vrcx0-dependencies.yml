# GitHub discovers workflow_dispatch on the default branch. Run on vrcx0-distfiles.
name: Build VRCX-0 dependency archives

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version (e.g. 2.36.0 or 2.36.0-beta.2)'
        required: true
        type: string

permissions: {}

jobs:
  select-branch:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::error::Select the vrcx0-distfiles branch in Run workflow.'
          exit 1
