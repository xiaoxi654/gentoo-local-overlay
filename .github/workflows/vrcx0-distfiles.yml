name: VRCX-0 dependency distfiles

on:
  push:
    branches: [vrcx0-distfiles-2.35.0-v2]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Fetch and bundle upstream dependencies
        env:
          VRCX_COMMIT: 1b83673ba5d1eac524b62a7a2dd953c31745b99c
          VRCX_SHA256: 5006be235e10165649dd3aada474787352960802c87b8ab9c8cfc2625c119bf9
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/Map1en/VRCX-0/archive/${VRCX_COMMIT}.tar.gz" \
            --output vrcx0-2.35.0.tar.gz
          python3 .github/scripts/bundle-vrcx0-deps.py vrcx0-2.35.0.tar.gz distfiles \
            --package vrcx0-2.35.0 --commit "$VRCX_COMMIT" --source-sha256 "$VRCX_SHA256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vrcx0-distfiles
          path: distfiles/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vrcx0-distfiles
          path: distfiles
      - name: Publish dependency archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vrcx0-2.35.0-deps-v2 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false --title 'VRCX-0 2.35.0 dependency distfiles (v2)' \
            --notes 'Separate Cargo vendor and ready-to-use npm node_modules archives built from the upstream v2.35.0 locks. Linux x86-64 glibc only. The VRCX-0 application is not prebuilt.' \
            distfiles/vrcx0-2.35.0-cargo.tar.xz \
            distfiles/vrcx0-2.35.0-node-modules-linux-x64-gnu.tar.xz
